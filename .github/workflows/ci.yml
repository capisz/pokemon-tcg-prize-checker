name: Verify PrizeCheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: prizecheck:ci
      - name: Verify non-root container and packaged application
        run: |
          docker run -d --name prizecheck-ci -p 127.0.0.1:3000:3000 prizecheck:ci
          test "$(docker exec prizecheck-ci id -u)" = 1000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          node scripts/container-smoke.mjs
      - name: Container logs
        if: failure()
        run: docker logs prizecheck-ci
      - name: Cleanup
        if: always()
        run: docker rm -f prizecheck-ci || true
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_USE_EMULATORS: "true"
      FIREBASE_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --only auth,firestore --project demo-prizecheck "npm run test:rules && npm run test:e2e"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
